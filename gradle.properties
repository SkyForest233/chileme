org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Enable Gradle build cache so agent builds get cache hits on unchanged template
# files. Cache is keyed by content hash (not path), so copies of this workspace
# reuse entries compiled into the worker Docker image via assembleDebug --build-cache.
org.gradle.caching=true
org.gradle.parallel=true
# GitHub Actions 共享 IP 偶发被 Maven Central 返回 403（CDN 限流），
# 提高依赖下载重试次数与退避，增强对瞬时网络故障的健壮性。
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=1000
