# detekt 配置（2026-09-15 引入 CI 静态门禁）
#
# 定位：**抓「真 bug」+ 少量高价值风格规则**；纯格式问题交给 ktlint（见 .editorconfig）。
#
# 为什么不做「默认配置全开」
# ----------------------
# detekt 默认配置面向「公共库 + 严格团队」，对本项目这类应用层业务代码会报出大量主观项
# （MagicNumber / MaxLineLength / LongMethod / TooManyFunctions / 泛型异常捕获…）。
# 逐条豁免会得到一份几百行的 detekt.yml，而且没人会读。
#
# 策略：开「疑似缺陷」类规则集 + style 里与真实缺陷最相关的几条，其余显式关闭。
#   potential-bugs  空值 / 分支 / 相等性等真实缺陷
#   coroutines      协程用法（项目里全是 viewModelScope）
#   empty-blocks    空函数体 / 空 catch（吞异常）
#   performance     明显的性能陷阱
#   style           只留 UnusedImports / UnusedPrivate* / 少量明显冗余；其余见下方关闭列表
#
# 迭代方式：门禁脚本支持 GATES_MODE=report（或 DETEKT_MODE=report）只报告不拦截，
# 用来在不动 CI 状态的前提下收敛规则。详见 docs/WORKFLOW.md §3「CI 静态门禁」。
#
# ⚠️⚠️ 本文件是**覆盖层**，不是完整配置 —— 必须与 `--build-upon-default-config` 一起用
# --------------------------------------------------------------------------
# 2026-09-16 实测（此前 detekt 一直空转、报告恒为 0 条）：detekt CLI 只给 `--config detekt.yml`
# 时**不会**拿默认配置当基线，于是「本文件没逐条列出的规则」一律不激活 —— 下面这些
# `potential-bugs: active: true` / `style: active: true` 只开了**规则集**，集内规则一条都没跑。
# 证据：一个含 4 处必然命中违规的 canary 文件，用本配置报 0 条；去掉 `--config` 用默认配置
# 跑同一文件则 4 条全中（LongParameterList / LongMethod / FunctionOnlyReturningConstant /
# UnusedPrivateMember）、exit=2。加上 `--build-upon-default-config` 后本文件才成为「默认之上的覆盖」。
# 推论：**这里没写 ≠ 关闭**（没写 = 用 detekt 默认值）；要关必须显式 `active: false`。
# `tools/ci-gates.sh` 里的 `detekt_selftest` 会在每次门禁前先验一遍「规则确实在跑」，
# 命中 0 条直接判红 —— 别再让这个门静静失效一次。

build:
  # 有任何一条 issue 就让 CI 失败（0 = 零容忍，不用权重打分）
  maxIssues: 0

# ⚠️ 改这个文件务必核对键名：detekt 的 config.validation=true 会让**拼错的规则名直接 fail**
#   （CI 日志是 "Property 'style>Xxx' is misspelled or does not exist" + exit=3，且报告为空）。
#   核对方法（2026-09-15 实践）：拉官方默认配置比对自己的键路径 ——
#     gh api -H "Accept: application/vnd.github.raw" \
#       "repos/detekt/detekt/contents/detekt-core/src/main/resources/default-detekt-config.yml?ref=v1.23.8" \
#       > /tmp/detekt-default.yml
#   本文件已按该方法逐键核对（1.23.8 全部键名存在）。
config:
  validation: true
  warningsAsErrors: false

# ---- 关闭：主观/与 ktlint 重叠的类别 ----
comments:
  active: false
naming:
  active: false

# ---- complexity：2026-09-16 开启（第三批 #2），并按实测清单收敛 ----
# 修好 `--build-upon-default-config` 之后 detekt 第一次真跑起来，全仓 **73 条发现 / 6 个规则**：
#
#   LongMethod 33 · LongParameterList 24 · TooManyFunctions 7 · CyclomaticComplexMethod 7
#   ComplexCondition 1 · LoopWithTooManyJumpStatements 1
#
# 即：**potential-bugs / coroutines / empty-blocks / performance / exceptions / style 全为 0** ——
# 「疑似缺陷」那几类本来就是干净的，73 条全部是体量与复杂度指标。分两类处理：
#
# · 后 2 条（各 1 处）**改代码**：`CsvExport.escapeCsvField` 的 4 个 contains 串联 → `any { }`；
#   `NutstoreSync.parsePropfind` 的 for + 2 个 continue → `mapNotNull`。规则保留（便宜、命中少、
#   真指向「读不动」的地方）。
# · 前 4 条（71 处）**显式关闭**，理由不是「不想管」而是「管的方式不对」：
#   - LongMethod(33) / CyclomaticComplexMethod(7)：命中的几乎全是 Compose 屏幕（一个屏幕就是一个
#     长 @Composable：MiuixSettingsScreen 863 行、EditFoodScreen 557 行…）。真正要做的拆分是
#     路线图 #3（双主题去重 + App 级组件层），目标是可数的「16 个渲染层文件 → 8 个、7,205 行 →
#     4,500 量级」，而不是让 detekt 天天报 40 条永远不拦的噪声。
#   - LongParameterList(24)：命中的多是 `*State.kt` 状态容器（`FoodDetailUiState` 13 个形参）与
#     App 级组件（`AppNavHost` 9、`MainTabsPager` 11、`BatchMoveLocationDialog` 8）。前者是**刻意的
#     设计**（精确订阅要求把字段摊平，见 SettingsState.kt 说明），后者由 #3 收窄成回调后再评估阈值。
#   - TooManyFunctions(7)：`AppViewModel` 53 个、`FoodRepository` 47 个 —— 正是路线图 #5（Repository
#     拆分 + 轻量 DI）要拆的对象。规则没错，但现在开着的唯一效果是噪声。
#   噪声的代价是具体的：71 条永远红的发现会让人不再读这份报告，剩下那 2 条真问题反而被埋掉。
#   #3 / #5 做完后应回来重新评估这 4 条（至少 LongParameterList 可以把阈值降回来）。
complexity:
  active: true
  LongMethod:
    active: false
  CyclomaticComplexMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false
  # ComplexCondition 保留默认（阈值 4）：唯一那处命中已修。

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
  PrintStackTrace:
    active: true

# ---- 开启：疑似缺陷类 ----
potential-bugs:
  active: true

coroutines:
  active: true

empty-blocks:
  active: true

performance:
  active: true

# ---- style：只留能指向真实问题的几条，其余显式关闭 ----
style:
  active: true
  # 与 ktlint / 格式化轮次重叠，或对本仓库属于主观项
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false        # 由 ktlint 的 no-wildcard-imports 负责
  TrailingWhitespace:
    active: false        # 由 ktlint 负责
  NewLineAtEndOfFile:
    active: false        # 由 ktlint 的 final-newline 负责
  ForbiddenComment:
    active: false        # 不允许 TODO/FIXME 的硬性规定不适用
  ReturnCount:
    active: false        # 早返回在本项目是刻意的可读性选择
  VarCouldBeVal:
    active: false        # Compose / 状态容器里 var 常是刻意的
  UseDataClass:
    active: false        # 状态容器类刻意不用 data class（见 SettingsState.kt 说明）
  ExplicitItLambdaParameter:
    active: false        # 主观风格
  BracesOnIfStatements:
    active: false        # 主观风格（旧名 MandatoryBracesIfStatements 在 1.23.8 已停用）
  MandatoryBracesLoops:
    active: false        # 同上
  UnnecessaryAbstractClass:
    active: false        # 主观
  CanBeNonNullable:
    active: false        # 需要类型推断上下文，易误报
  UnderscoresInNumericLiterals:
    active: false        # 主观
  # 保留默认开启的高价值规则（此处不写 = 用 detekt 默认值，前提是 --build-upon-default-config）：
  #   UnusedImports        未使用的 import（ktlint 的同类规则已弃用，这里兜底）
  #   UnusedPrivateMember  私有函数/属性没人用 = 死代码
  #   UnusedPrivateProperty 同上
  #   UnusedPrivateClass   私有类没人用
  #   EqualsNullCall / UnconditionalJumpStatementInLoop / etc.
