name: Build Release APK

# 打 v* tag（如 v2.8.0）自动构建签名 APK 并发布 GitHub Release。
# 手动触发：Actions → Build Release APK → Run workflow（默认分支 master）。
# 手动跑在分支上只上传 artifact；选中 v* tag 时同时创建 Release。
# Release 说明不自动生成，请在 GitHub Release 页面自行填写。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # versionCode 必须单调递增，否则系统视为同一版本、无法覆盖升级。
          # run_number 在仓库维度单调递增，天然满足。
          APP_VERSION_CODE: ${{ github.run_number }}
          # tag 构建取 tag 名（build.gradle.kts 会剥掉前导 v）；手动跑分支时为分支名，
          # 此时不作为版本名使用，交由 build 脚本回落 "1.0"。
          APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./gradlew assembleRelease

      # 防回归：确认产物不是 debug 签名。build.gradle.kts 已在凭据缺失时直接失败，
      # 这里再从产物侧兜一道，防止未来有人重新引入静默降级。
      - name: Verify release signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK 使用了 debug 签名，拒绝发布。"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
