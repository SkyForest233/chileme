name: Build Release APK

# 打 v* tag（如 v2.8.0）自动构建签名 APK 并发布 GitHub Release。
# 手动触发：Actions → Build Release APK → Run workflow（默认分支 master）。
# 手动跑在分支上只上传 artifact；选中 v* tag 时同时创建 Release。
# Release 说明不自动生成，请在 GitHub Release 页面自行填写。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 重复触发时取消旧的运行，避免并发打包互相覆盖 artifact。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 与 build.yml 保持一致：启用 Gradle 依赖与构建缓存。
      # 此前 release 构建缺这一步，每次都全量下载依赖——既慢，
      # 又更容易因网络抖动导致依赖解析失败。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # tag 构建不写缓存，避免污染 master 的缓存条目；只读复用即可。
          cache-read-only: true

      # 先于构建做凭据自检：缺失时给出明确指引，而不是等到 Gradle 抛异常。
      # 只输出「是否存在」，绝不打印密钥内容。
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少 secret：RELEASE_${name}（或兼容名 ${name}）"
              missing=1
            else
              echo "✓ ${name} 已配置"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::请在 Settings → Secrets and variables → Actions 配置上述 secrets。"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          # tr -d 去掉可能存在的折行/回车：某些平台 base64 默认带换行，
          # 直接 -d 会得到损坏的 keystore（报 Invalid keystore format）。
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r' | base64 -d > keystore/release.keystore
          if [ ! -s keystore/release.keystore ]; then
            echo "::error::解码后的 keystore 为空，请检查 RELEASE_KEYSTORE_BASE64 是否完整。"
            echo "::error::生成方式：base64 -w0 release.keystore（macOS：base64 -i release.keystore | tr -d '\\n'）"
            exit 1
          fi
          echo "keystore 大小：$(stat -c%s keystore/release.keystore) 字节"

      # 提前校验密钥库口令与 alias 是否匹配，失败信息比 Gradle 的更直观。
      - name: Validate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if ! keytool -list -keystore keystore/release.keystore \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::keystore 校验失败：口令错误、alias 不存在，或文件已损坏。"
            echo "::error::可用 keytool -list -v -keystore <file> 在本地确认 alias 名称。"
            exit 1
          fi
          echo "✓ keystore 与 alias 校验通过"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          # 注意：这四个环境变量名由 app/build.gradle.kts 读取，不可改名。
          # 右侧优先取 RELEASE_ 前缀的 secret，兼容旧的无前缀命名。
          RELEASE_KEYSTORE_PATH: keystore/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          # versionCode 必须单调递增，否则系统视为同一版本、无法覆盖升级。
          # run_number 在仓库维度单调递增，天然满足。
          APP_VERSION_CODE: ${{ github.run_number }}
          # tag 构建取 tag 名（build.gradle.kts 会剥掉前导 v）；手动跑分支时为分支名，
          # 此时不作为版本名使用，交由 build 脚本回落 "1.0"。
          APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: ./gradlew assembleRelease --no-daemon

      # 防回归：确认产物不是 debug 签名。build.gradle.kts 已在凭据缺失时直接失败，
      # 这里再从产物侧兜一道，防止未来有人重新引入静默降级。
      - name: Verify release signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Verifying $APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::Release APK 使用了 debug 签名，拒绝发布。"
            exit 1
          fi

      # 构建产物之外，keystore 绝不能留在工作区被打包进 artifact。
      - name: Clean up keystore
        if: always()
        run: rm -rf keystore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
